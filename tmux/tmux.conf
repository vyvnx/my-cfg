set -g repeat-time 1000
# Enable true color support
set-option -sa terminal-overrides ",xterm*:Tc"

setw -g mode-keys vi

# vim-style copy mode: v selects, C-v toggles block, y yanks and exits.
# set-clipboard on pushes the yank to the system clipboard via OSC 52,
# which any modern terminal handles — no pbcopy/xclip, no vendor lock.
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Dark grey aesthetic theme
set -g @minimal-tmux-bg "#2d2d2d"
set -g @minimal-tmux-fg "#a0a0a0"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator-str ""
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# Whole-number percentages keep the metrics readable at a glance
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"
set -g @gpu_percentage_format "%3.0f%%"

# tmux defaults status-right-length to 40, which truncates the tail (clips the time);
# widen it so the whole metrics+date segment renders.
set -g status-right-length 80

# Line 1 (top): CPU/GPU/RAM + date on the right (minimal-tmux-status owns this line)
set -g @minimal-tmux-status-right-extra ' #[fg=#666666]#{ram_icon}#{ram_percentage} #{cpu_icon}#{cpu_percentage} #{gpu_icon}#{gpu_percentage}#[fg=#888888] | %d-%m-%Y %H:%M '

# Two status lines; line 2 (bottom) carries the IP/location on its own, right-aligned.
# The plugin only manages line 1, so status-format[1] is ours to define freely.
set -g status 2
set -g status-format[1] '#[align=right]#[fg=#666666]#(~/.config/tmux/scripts/status-ip.sh) '

# Aesthetic black/grey color scheme
set -g status-bg "#1a1a1a"
set -g status-fg "#888888"
# Pane borders: dim grey for inactive, bright "hacker green" for the focused pane
set -g pane-border-style fg="#333333"
set -g pane-active-border-style fg="#00ff5f,bold"
# Heavier line on the active pane so the focused border pops
set -g pane-border-lines "heavy"
set -g message-style bg="#2d2d2d",fg="#cccccc"
set -g mode-style bg="#3d3d3d",fg="#eeeeee"

# Clock mode
setw -g clock-mode-colour "#666666"

# CPU/RAM/GPU monitoring icons (aesthetic grey themed)
set -g @cpu_low_icon "◇"
set -g @cpu_medium_icon "◈"
set -g @cpu_high_icon "◆"

set -g @ram_low_icon "○"
set -g @ram_medium_icon "◐"
set -g @ram_high_icon "●"

set -g @gpu_low_icon "□"
set -g @gpu_medium_icon "◨"
set -g @gpu_high_icon "■"

# Statusbar configuration
# Note: minimal-tmux-status handles the status bar, use @minimal-tmux-status-right-extra for custom right content

setw -g window-status-current-style 'fg=#eeeeee bg=#2d2d2d'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#888888 bg=#1a1a1a'
setw -g window-status-format ' #I #[fg=#aaaaaa]#W #[fg=#666666]#F '

# Split windows maintaining the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Start windows and panes from index 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Vim-aware pane navigation: send C-h/j/k/l to vim when a vim pane is
# focused so nvim splits move, otherwise switch tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Renumber windows automatically
set-option -g renumber-windows on

# Disable automatic renaming of windows
set-option -g allow-rename off

# Change the prefix key from C-b to C-space
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Bind keys for easier navigation
bind -n M-H previous-window
bind -n M-L next-window

# Reload the tmux configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# Custom command to set up a dev environment
bind k run-shell "tmux split-window -h -p 30 \; \
  tmux select-pane -t 0 \; \
  tmux send-keys 'cd #{pane_current_path} && npm run dev' C-m \; \
  tmux select-pane -t 1 \; \
  tmux send-keys 'cd #{pane_current_path} && nvim .' C-m"

bind-key -n M-k send-keys clear C-m

bind-key -n M-m set -g mouse \; display-message "Mouse mode toggled: #{mouse}"

bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# Close all windows except the current one
bind-key C-w kill-pane -a

# Pin tpm's plugin path: it auto-switches to ~/.config/tmux/plugins/ once it sees
# an XDG tmux.conf, but install.sh always installs plugins under ~/.tmux/plugins/.
# Without this override tpm silently finds no plugins and the status bar reverts to defaults.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override vim-tmux-navigator's C-l (bound above by tpm) so Ctrl-L still clears:
# forward to vim if focused; else navigate right, but fall through to clear-screen
# when there's no pane to the right (pane_at_right). Must stay after `run tpm`.
bind -n C-l if-shell "$is_vim" 'send-keys C-l' "if-shell -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'"
